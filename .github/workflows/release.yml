name: release

# Construit Quark sous Linux et publie une release GitHub à chaque push sur
# main (ou manuellement depuis l'onglet Actions). Le numéro de version vient
# de Cargo.toml : le tag `v<version>` est créé/actualisé automatiquement.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Dépendances système (X11, Wayland, GL)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libx11-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev

      - name: Version
        id: version
        run: echo "value=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"

      - name: Compilation
        run: cargo build --release --locked

      - name: Paquet
        run: |
          mkdir -p dist/quark
          cp target/release/quark dist/quark/
          cp README.md dist/quark/
          tar -czf "quark-${{ steps.version.outputs.value }}-linux-x86_64.tar.gz" -C dist quark
          sha256sum "quark-${{ steps.version.outputs.value }}-linux-x86_64.tar.gz" > "quark-${{ steps.version.outputs.value }}-linux-x86_64.tar.gz.sha256"

      - name: Aperçus de l'interface (rendu hors écran, aucun écran requis)
        run: |
          mkdir -p dist/renders
          export HOME="$PWD/dist/home"
          for spec in \
            "list:--view list" \
            "grid:--view grid" \
            "store:--tab store" \
            "info:--view list --info" \
            "running:--view list --running" \
            "hover-row:--view list --hover 160,340" \
            "hover-tile:--view grid --hover 150,300" \
            "dialog-settings:--dialog settings" \
            "dialog-settings-defaults:--dialog settings-defaults" \
            "dialog-updates:--dialog updates" \
            "dialog-game:--dialog game" \
            "dialog-logs:--dialog logs" \
            "dialog-add:--dialog add" \
            "dialog-artwork:--dialog artwork" \
            "dialog-customize:--dialog customize" \
            "dialog-scan:--dialog scan" \
            "dialog-remove:--dialog remove" \
            "keyboard:--view list --key down" \
            "marked:--view list --marked" \
            "dialog-remove-many:--marked --dialog remove" \
            "home:--home" \
            "grid-overlay:--view grid --dialog overlay" \
            "settings-stats:--dialog settings-stats" \
            "settings-disk:--dialog settings-disk" \
            "dialog-steam:--dialog steam" \
            "wide:--size 2560x900 --view list" \
            "small:--size 1024x640 --view list"; do
            name="${spec%%:*}"
            opts="${spec#*:}"
            ./target/release/quark --ui "dist/renders/ui-$name.png" --demo $opts
          done

      - name: Publication des aperçus
        uses: actions/upload-artifact@v4
        with:
          name: quark-ui-renders
          path: dist/renders/*.png
          if-no-files-found: error

      - name: Publication de la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Quark v${{ steps.version.outputs.value }}
          body: |
            ## Nouveautés de la 0.9.1

            - **Accueil** : le carrousel peut défiler tout seul (Appearance → Home, 3 à 60 s),
              avec une ligne de progression sous la bannière.
            - **Filtres** sur l'accueil et dans la colonne de gauche : statut, genre Steam, tag
              personnel.
            - **Statut et notes personnelles** : *À jouer*, *En cours*, *Terminé*,
              *Abandonné*, plus des notes libres par jeu.
            - **Collections et tags personnalisés** (par exemple `coop`) : création, suppression
              et filtrage comme les catégories Steam.
            - **Métadonnées Steam** : développeur, genres, date de sortie et description
              courte, depuis l'API `appdetails`, avec filtrage par genre.
            - **Statistiques** : launcher qui garde l'historique des sessions (début et durée).
              Temps total, semaine en cours, série de jours consécutifs, heures par semaine,
              calendrier de chaleur et jeux les plus joués.
            - **Espace disque** : poids de chaque préfixe Proton, du cache d'artworks, des
              journaux, des archives de mise à jour et des dossiers de jeux, mesuré en
              arrière-plan.
            - **Import de la bibliothèque Steam installée** : lit les `appmanifest_*.acf` de
              toutes les bibliothèques, détecte l'exécutable et récupère artworks et
              métadonnées ; les jeux déjà présents ne sont pas dupliqués.
            - **Vue grille** : la grille seule, la fiche du jeu s'ouvrant en surimpression avec
              une croix (ou un clic à côté).
            - **Fiche de jeu** : fond = bannière floutée au lieu du noir complet ; boutons
              colorés (poubelle rouge, crayon vert, engrenage bleu) ; dernière session affichée.
            - **Icônes** de la liste et de la grille plus arrondies ; les petites icônes
              d'action sont colorées.
            - **Ctrl+Q** quitte complètement Quark (icône de notification comprise).
            - **Logo Quark** embarqué : icône de fenêtre (X11/Wayland, `app_id=quark`) et
              fichier `assets/quark.desktop`.
            - **Exécutable manquant** : le lancement est refusé et le jeu reste surligné en
              rouge jusqu'à correction du chemin.
            - **Actualités** : les images ont été retirées des cartes, le texte reste lisible
              dans l'application.
            - Libellé « Bibliothèque » et mention « Ctrl+clic : sélection multiple » supprimés
              de la colonne de gauche.

            Archives Linux x86_64 et sommes SHA-256 ci-dessous. Les aperçus de l'interface
            sont produits par le rendu hors écran (workflow Actions).
          fail_on_unmatched_files: true
          files: |
            quark-${{ steps.version.outputs.value }}-linux-x86_64.tar.gz
            quark-${{ steps.version.outputs.value }}-linux-x86_64.tar.gz.sha256
