name: release

# Construit Quark sous Linux et publie une release GitHub à chaque push sur
# main (ou manuellement depuis l'onglet Actions). Le numéro de version vient
# de Cargo.toml : le tag `v<version>` est créé/actualisé automatiquement.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Dépendances système (X11, Wayland, GL)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libx11-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev

      - name: Version
        id: version
        run: echo "value=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"

      - name: Compilation
        run: cargo build --release --locked

      - name: Paquet
        run: |
          mkdir -p dist/quark
          cp target/release/quark dist/quark/
          cp README.md dist/quark/
          tar -czf "quark-${{ steps.version.outputs.value }}-linux-x86_64.tar.gz" -C dist quark
          sha256sum "quark-${{ steps.version.outputs.value }}-linux-x86_64.tar.gz" > "quark-${{ steps.version.outputs.value }}-linux-x86_64.tar.gz.sha256"

      - name: Aperçus de l'interface (rendu hors écran, aucun écran requis)
        run: |
          mkdir -p dist/renders
          export HOME="$PWD/dist/home"
          for spec in \
            "list:--view list" \
            "grid:--view grid" \
            "store:--tab store" \
            "my-games:--tab my-games --providers-demo" \
            "dialog-settings-providers:--dialog settings-providers" \
            "info:--view list --info" \
            "running:--view list --running" \
            "hover-row:--view list --hover 160,340" \
            "hover-tile:--view grid --hover 150,300" \
            "dialog-settings:--dialog settings" \
            "dialog-settings-defaults:--dialog settings-defaults" \
            "dialog-updates:--dialog updates" \
            "dialog-game:--dialog game" \
            "dialog-logs:--dialog logs" \
            "dialog-add:--dialog add" \
            "dialog-artwork:--dialog artwork" \
            "dialog-customize:--dialog customize" \
            "dialog-scan:--dialog scan" \
            "dialog-remove:--dialog remove" \
            "keyboard:--view list --key down" \
            "marked:--view list --marked" \
            "dialog-remove-many:--marked --dialog remove" \
            "home:--home" \
            "grid-overlay:--view grid --dialog overlay" \
            "settings-stats:--dialog settings-stats" \
            "settings-disk:--dialog settings-disk" \
            "dialog-steam:--dialog steam" \
            "wide:--size 2560x900 --view list" \
            "small:--size 1024x640 --view list"; do
            name="${spec%%:*}"
            opts="${spec#*:}"
            ./target/release/quark --ui "dist/renders/ui-$name.png" --demo $opts
          done

      - name: Publication des aperçus
        uses: actions/upload-artifact@v4
        with:
          name: quark-ui-renders
          path: dist/renders/*.png
          if-no-files-found: error

      - name: Publication de la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Quark v${{ steps.version.outputs.value }}
          body: |
            ## Quark 1.0 — boutique Steam, bibliothèques unifiées, sauvegardes

            - **Boutique Steam** : offres régionales, recherche, prix dans votre devise, cache
              local réutilisé hors ligne (et signalé comme potentiellement périmé),
              recommandations calculées sur votre machine à partir de votre bibliothèque. Aucun
              achat dans Quark : la fiche s'ouvre sur le site officiel.
            - **Mes jeux** : les jeux Steam (manifestes locaux) et Epic (via Legendary) réunis
              sur une page, filtrables par boutique, avec l'état d'installation réel. Les
              doublons d'un même titre peuvent être fusionnés puis séparés.
            - **Installations déléguées** : « Installer via Steam » passe l'AppID au client puis
              rescanne ; « Installer via Legendary » installe dans le dossier choisi et ne
              déclare un jeu installé qu'après avoir trouvé son dossier local.
            - **Outils gérés** : Legendary et Ludusavi (et gogdl, pas encore branché) sont
              téléchargés depuis leurs releases officielles avec digest SHA-256 obligatoire,
              version comparée au tag et remplacement atomique — un échec laisse l'outil
              précédent en place.
            - **Sauvegardes locales (Ludusavi)** : dossiers de sauvegarde personnalisés fusionnés
              dans une configuration isolée sans perdre les réglages existants, aperçu avant
              écriture, confirmation explicite, un coffre par installation (10 sauvegardes
              complètes, aucune différentielle), instantanés automatiques au lancement et à la
              sortie sans jamais bloquer un jeu, restauration par inventaire + aperçu +
              confirmation avec revalidation des chemins.
            - **Identifiants séparés** : `credentials.json` en mode 0600, non chiffré et
              explicitement signalé comme tel, secrets expurgés des sorties ; une réponse Steam
              vide reste ambiguë et n'efface jamais la bibliothèque connue.
            - **README anglais** couvrant les fournisseurs, les outils gérés, les sauvegardes et
              la procédure de vérification (`docs/verification/ludusavi-config.md`).

            Limites assumées de cette version : GOG n'est pas encore branché, les achievements
            et la synchronisation cloud ne sont pas proposés faute de source vérifiée, cible
            Linux x86_64 uniquement. Archives et sommes SHA-256 ci-dessous ; les aperçus de
            l'interface sont produits par le rendu hors écran.
          fail_on_unmatched_files: true
          files: |
            quark-${{ steps.version.outputs.value }}-linux-x86_64.tar.gz
            quark-${{ steps.version.outputs.value }}-linux-x86_64.tar.gz.sha256
