name: release

# Construit Quark sous Linux et publie une release GitHub à chaque push sur
# main (ou manuellement depuis l'onglet Actions). Le numéro de version vient
# de Cargo.toml : le tag `v<version>` est créé/actualisé automatiquement.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Dépendances système (X11, Wayland, GL)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libx11-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev

      - name: Version
        id: version
        run: echo "value=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"

      - name: Compilation
        run: cargo build --release --locked

      - name: Paquet
        run: |
          mkdir -p dist/quark
          cp target/release/quark dist/quark/
          cp README.md dist/quark/
          tar -czf "quark-${{ steps.version.outputs.value }}-linux-x86_64.tar.gz" -C dist quark
          sha256sum "quark-${{ steps.version.outputs.value }}-linux-x86_64.tar.gz" > "quark-${{ steps.version.outputs.value }}-linux-x86_64.tar.gz.sha256"

      - name: Aperçus de l'interface (rendu hors écran, aucun écran requis)
        run: |
          mkdir -p dist/renders
          export HOME="$PWD/dist/home"
          for spec in \
            "list:--view list" \
            "grid:--view grid" \
            "store:--tab store" \
            "info:--view list --info" \
            "running:--view list --running" \
            "hover-row:--view list --hover 160,340" \
            "hover-tile:--view grid --hover 150,300" \
            "dialog-settings:--dialog settings" \
            "dialog-settings-defaults:--dialog settings-defaults" \
            "dialog-updates:--dialog updates" \
            "dialog-game:--dialog game" \
            "dialog-logs:--dialog logs" \
            "dialog-add:--dialog add" \
            "dialog-artwork:--dialog artwork" \
            "dialog-customize:--dialog customize" \
            "dialog-scan:--dialog scan" \
            "dialog-remove:--dialog remove" \
            "keyboard:--view list --key down" \
            "marked:--view list --marked" \
            "dialog-remove-many:--marked --dialog remove" \
            "home:--home" \
            "grid-overlay:--view grid --dialog overlay" \
            "settings-stats:--dialog settings-stats" \
            "settings-disk:--dialog settings-disk" \
            "dialog-steam:--dialog steam" \
            "wide:--size 2560x900 --view list" \
            "small:--size 1024x640 --view list"; do
            name="${spec%%:*}"
            opts="${spec#*:}"
            ./target/release/quark --ui "dist/renders/ui-$name.png" --demo $opts
          done

      - name: Publication des aperçus
        uses: actions/upload-artifact@v4
        with:
          name: quark-ui-renders
          path: dist/renders/*.png
          if-no-files-found: error

      - name: Publication de la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Quark v${{ steps.version.outputs.value }}
          body: |
            ## Nouveautés de la 0.9.2

            - **Sections par statut** dans la vue liste, comme les colonnes Steam : *En cours*,
              *À jouer*, *Terminé*, *Abandonné*, puis *Sans statut*. Chaque titre porte sa
              pastille de couleur et son nombre de jeux, un filet sépare les sections, et un
              clic sur le titre replie la section.
            - **Bannière fondue dans le fond flouté** : ses derniers 34 % se dissolvent au lieu
              de s'arrêter net, avec un voile progressif qui garde le texte lisible jusqu'en
              bas de la fiche.
            - **Menu du clic droit à icônes colorées** : lancer, personnaliser, paramètres et
              retirer, sur des pastilles sombres lisibles même sur une bannière claire.
            - **Icônes d'action plus contrastées** : poubelle rouge, crayon vert et engrenage
              bleu sont posés sur un disque sombre cerclé de leur couleur ; ils restent nets
              sur fond clair.
            - **Grille corrigée** : les affiches ne débordent plus à droite (espacement d'egui
              compté en trop), et les jeux sans couverture affichent un monogramme plein cadre,
              à la même place que les autres couvertures.
            - **Commandes regroupées en haut à droite** : l'ajout et le basculement liste/grille
              n'existent plus qu'à cet endroit ; le bouton Accueil reste au-dessus de la liste.
            - **Import de la bibliothèque Steam déplacé dans les paramètres** (Apparence), au
              lieu d'un bouton à côté de `+` qui prêtait à confusion.
            - **Onglet Proton supprimé** : runtimes détectés, bouton *Redétecter* et résumé
              anti-triche sont dans « Par défaut », juste sous le choix du runtime.
            - **Mémoire bornée** : le cache de textures est plafonné à 96 entrées (les plus
              anciennes sont libérées), celui des bannières floutées à 32. Parcourir la
              bibliothèque ne fait plus grimper la consommation ; « À propos » affiche la
              mémoire résidente et le nombre de textures en cache.
            - **Fenêtres de réglages** : le pied de page ne recouvre plus le contenu quand une
              page est longue ; le journal s'ouvre sur un fond opaque et ne déborde plus de
              l'écran avec ses longues lignes.

            Archives Linux x86_64 et sommes SHA-256 ci-dessous. Les aperçus de l'interface
            sont produits par le rendu hors écran (workflow Actions).
          fail_on_unmatched_files: true
          files: |
            quark-${{ steps.version.outputs.value }}-linux-x86_64.tar.gz
            quark-${{ steps.version.outputs.value }}-linux-x86_64.tar.gz.sha256
