[package]
name = "quark"
version = "1.0.2"
edition = "2024"

[dependencies]
dirs = "7.0.0"
eframe = { version = "0.32", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
egui_extras = { version = "0.32", features = ["file", "image", "http"] }
# Décodage des artworks : egui_extras dépend d'`image` sans codec, on les
# active ici pour pouvoir décoder les JPEG/PNG servis par Steam et SteamGridDB.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "query", "rustls"] }
# Sélecteur de fichiers natif : XDG Desktop Portal (GTK ou KDE du bureau), sans
# dépendance GTK à la compilation.
rfd = "0.15"
libc = "0.2"
ring = "0.17"
flate2 = "1.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Configuration Ludusavi : un `config.yaml` existant peut être du YAML commenté,
# pas seulement le JSON que Quark y écrit. `serde_yaml` étant archivé, on prend
# le fork maintenu, d'API identique.
serde_yaml_ng = "0.10"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
